stages:
  - test
  - build
  - deploy

variables:
  GIT_CLEAN_FLAGS: "none"

  # ================================================================
  # 镜像 / 注册表地址
  # ================================================================
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"

  # ================================================================
  # 构建变量
  # ================================================================
  API_IMAGE_NAME: "mobile_portainer-api"
  WEB_IMAGE_NAME: "mobile_portainer-web"
  IMAGE_TAG: "${CI_COMMIT_SHORT_SHA}"

  # ================================================================
  # 部署变量 —— 可在 GitLab UI 中覆盖
  # ================================================================
  DEPLOY_API_CONTAINER_NAME: "mobile-portainer-api"
  DEPLOY_PORT: "8080"
  DEPLOY_NETWORK: "mobile_portainer_default"
  DEPLOY_DATA_DIR: "/volume2/docker/mobile_portainer/data"

  # 管理凭据
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "password"

# ================================================================
# 公共配置
# ================================================================
.setup:
  before_script:
    - |
      set +e
      echo "=== 环境信息 ==="
      echo "CI_PROJECT_DIR: $CI_PROJECT_DIR"
      echo "Python 版本: $(python3 --version 2>/dev/null || echo '未安装')"
      echo "Docker 版本: $(docker --version 2>/dev/null || echo '未安装')"

# ================================================================
# pytest —— 运行 Python 单元测试
# ================================================================
pytest:
  extends: .setup
  stage: test
  tags:
    - linux
    - docker
  timeout: 20m
  allow_failure: true
  cache:
    key: pip-cache-${CI_COMMIT_REF_SLUG}
    paths:
      - .pip-cache/
    policy: pull-push
  script:
    - |
      set -e
      echo "=== 1. 创建虚拟环境 ==="

      # 确保 venv 模块可用（Debian/Ubuntu 可能需要安装 python3-venv）
      if ! python3 -m venv --help >/dev/null 2>&1; then
        echo "venv 模块不可用，尝试安装 python3-venv ..."
        sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv || true
        pip install virtualenv -q 2>/dev/null || true
      fi

      # 尝试创建虚拟环境
      if python3 -m venv --help >/dev/null 2>&1; then
        echo "使用 venv 模块创建虚拟环境 ..."
        python3 -m venv .venv
        PIP=".venv/bin/pip"
        PYTHON=".venv/bin/python"
      else
        echo "使用 virtualenv 创建虚拟环境 ..."
        pip install virtualenv -q
        python3 -m virtualenv .venv
        PIP=".venv/bin/pip"
        PYTHON=".venv/bin/python"
      fi

      echo "=== 2. 升级 pip ==="
      $PIP install --upgrade pip -i ${PIP_INDEX_URL} --cache-dir .pip-cache/

      echo "=== 3. 安装项目依赖 ==="
      $PIP install -r requirements.txt -i ${PIP_INDEX_URL} --cache-dir .pip-cache/
      $PIP install -r requirements-dev.txt -i ${PIP_INDEX_URL} --cache-dir .pip-cache/

      echo "=== 4. 确认已安装的包 ==="
      $PIP list | grep -E "pytest|httpx|fastapi|sqlalchemy|docker"

      echo "=== 5. 运行 pytest ==="
      $PYTHON -m pytest tests/ -v --tb=short
  coverage: '/TOTAL.*\s+(\d+%)$/'

# ================================================================
# build —— 构建 Docker 镜像
#
# 使用 DOCKER_BUILDKIT=0 强制使用传统构建器（而非 BuildKit），
# 原因：BuildKit 在某些 NAS 环境（特别是使用 containerd 镜像
# 存储时）无法看到 classic docker pull 预拉取的镜像，导致构建
# 在解析基础镜像阶段挂起直到被 SIGKILL。传统构建器与 docker
# pull 共享同一个镜像存储，可以正常使用预拉取的镜像。
# ================================================================
build_images:
  extends: .setup
  stage: build
  tags:
    - linux
    - docker
  timeout: 60m
  script:
    - echo "=== 构建 API 镜像 ==="
    - |
      docker build \
        --progress=plain \
        -f Dockerfile.cn \
        --build-arg PIP_INDEX_URL=${PIP_INDEX_URL} \
        -t ${API_IMAGE_NAME}:${IMAGE_TAG} \
        -t ${API_IMAGE_NAME}:latest \
        . 2>&1 | tee /tmp/api_build.log
    - echo "--- API 镜像构建完成 ---"
    - echo "=== 构建 Web 镜像 ==="
    - |
      docker build \
        --progress=plain \
        -f Dockerfile.web.cn \
        --build-arg DOWNLOAD_BASE=${WEB_DOWNLOAD_BASE:-https://github.com} \
        -t ${WEB_IMAGE_NAME}:${IMAGE_TAG} \
        -t ${WEB_IMAGE_NAME}:latest \
        . 2>&1 | tee /tmp/web_build.log
    - echo "--- Web 镜像构建完成 ---"
    - echo "=== 镜像列表 ==="
    - docker images | grep mobile_portainer
  after_script:
    - |
      echo "构建完成"
      echo "  API 镜像: ${API_IMAGE_NAME}:${IMAGE_TAG}"
      echo "  Web 镜像: ${WEB_IMAGE_NAME}:${IMAGE_TAG}"

# ================================================================
# deploy —— 部署到目标服务器
# 自动检测 Docker 命令（docker 或 sudo docker），兼容不同 Runner 权限配置
# ================================================================
deploy:
  extends: .setup
  stage: deploy
  tags:
    - docker
    - nas
    - deploy
  needs:
    - job: build_images
  before_script:
    - |
      set +e
      echo "=== Docker 环境检查 ==="
      docker --version || { echo "错误：Docker CLI 不可用"; exit 1; }

      # ----------------------------------------------------------
      # 诊断：当前用户、socket 权限
      # ----------------------------------------------------------
      echo "当前用户: $(whoami), uid=$(id -u), groups=$(id -Gn)"
      echo "docker.sock 状态:"
      ls -la /var/run/docker.sock 2>/dev/null || echo "  /var/run/docker.sock 不存在"

      # ----------------------------------------------------------
      # 按优先级尝试 Docker 连接方式：
      #   1. docker（直接访问 socket）
      #   2. sudo chmod 修复 socket 权限
      #   3. sudo docker（免密 sudo）
      # ----------------------------------------------------------
      DOCKER="docker"
      if docker info >/dev/null 2>&1; then
        echo "✓ Docker daemon 连接正常（直接访问）"
      elif sudo -n chmod 666 /var/run/docker.sock 2>/dev/null && docker info >/dev/null 2>&1; then
        echo "✓ 通过 sudo 修复 socket 权限后连接正常"
      elif sudo -n docker info >/dev/null 2>&1; then
        DOCKER="sudo docker"
        echo "✓ Docker daemon 通过 sudo docker 连接正常"
      else
        echo ""
        echo "================================================"
        echo "错误：无法连接 Docker daemon！"
        echo ""
        echo "请在 NAS 上以 root 身份 SSH 执行以下命令："
        echo ""
        echo "  # 将 gitlab-runner 加入 docker 组（推荐方案）"
        echo "  sudo synogroup --add docker 2>/dev/null || true"
        echo "  sudo synogroup --member docker gitlab-runner"
        echo "  sudo chown root:docker /var/run/docker.sock"
        echo "  sudo chmod 660 /var/run/docker.sock"
        echo "  sudo systemctl restart gitlab-runner"
        echo ""
        echo "  # 备选方案：配置免密 sudo"
        echo "  echo 'gitlab-runner ALL=(ALL) NOPASSWD:/usr/local/bin/docker' > /etc/sudoers.d/gitlab-runner"
        echo "  chmod 440 /etc/sudoers.d/gitlab-runner"
        echo "================================================"
        exit 1
      fi
  script:
    - |
      echo "=== 1. 确保网络 ${DEPLOY_NETWORK} 存在 ==="
      if ! $DOCKER network inspect ${DEPLOY_NETWORK} >/dev/null 2>&1; then
        echo "创建网络 ${DEPLOY_NETWORK} ..."
        $DOCKER network create ${DEPLOY_NETWORK} || { echo "错误：无法创建 Docker 网络"; exit 1; }
      else
        echo "网络 ${DEPLOY_NETWORK} 已存在"
      fi

      echo "=== 2. 检查端口 ${DEPLOY_PORT} 占用 ==="
      PORT_PID=$($DOCKER ps --filter "publish=${DEPLOY_PORT}" --format '{{.ID}}' 2>/dev/null || true)
      if [ -n "$PORT_PID" ]; then
        echo "端口 ${DEPLOY_PORT} 被容器 ${PORT_PID} 占用，正在清理..."
        $DOCKER stop ${PORT_PID} 2>/dev/null || true
        $DOCKER rm ${PORT_PID} 2>/dev/null || true
      else
        echo "端口 ${DEPLOY_PORT} 未被占用"
      fi

      echo "=== 3. 清理旧容器 ==="
      $DOCKER stop ${DEPLOY_API_CONTAINER_NAME} 2>/dev/null || true
      $DOCKER rm ${DEPLOY_API_CONTAINER_NAME} 2>/dev/null || true

      echo "=== 4. 启动新容器 ==="
      $DOCKER run -d \
        --name ${DEPLOY_API_CONTAINER_NAME} \
        --network ${DEPLOY_NETWORK} \
        -p ${DEPLOY_PORT}:8000 \
        -v ${DEPLOY_DATA_DIR}:/app/data \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v /:/hostfs:ro \
        --restart unless-stopped \
        ${API_IMAGE_NAME}:${IMAGE_TAG}

      echo "=== 5. 等待健康检查 ==="
      for i in $(seq 1 30); do
        if curl -s http://localhost:${DEPLOY_PORT}/health >/dev/null 2>&1; then
          echo "✓ 服务健康检查通过"
          break
        fi
        echo "等待第 ${i} 次健康检查..."
        sleep 2
      done

      echo ""
      echo "部署完成！"
      echo "  API: http://localhost:${DEPLOY_PORT}"
      echo "  容器: ${DEPLOY_API_CONTAINER_NAME}"
      echo "  镜像: ${API_IMAGE_NAME}:${IMAGE_TAG}"
